<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Localização de Quadras</title>
<link rel="stylesheet" href="../css/global.css"/>
<style>
.hdr-title{line-height:1.2}
.mapa{width:100%;max-width:260px;display:block;margin:10px auto}
.mapa path{fill:#f0f0f0;stroke:#999;stroke-width:.8;cursor:pointer;transition:fill .2s}
.mapa path:hover,.mapa path.sel{fill:var(--orange)}
.city-block{margin-top:16px}
.city-block p{font-size:13px;font-weight:700;color:#111;font-style:italic;margin-bottom:8px;line-height:1.4}
.city-line{border:none;border-bottom:2px solid #333;width:70%;display:block;outline:none;font-size:14px;font-family:'Montserrat',sans-serif;padding:4px 0;background:transparent}
</style>
</head>
<body>
<div class="phone">
  <div class="hdr">
    <a href="home.html" class="ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <span class="hdr-title">LOCALIZAÇÃO<br>DE QUADRAS</span>
    <a href="configuracoes.html" class="ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
  </div>
  <div class="content">
    <p style="font-size:13px;font-weight:800;color:#111;text-transform:uppercase;line-height:1.4;margin-bottom:10px">ONDE VOCÊ ESTÁ?<br>(MARQUE NO MAPA)</p>
    <svg class="mapa" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
      <!-- Norte -->
      <path id="norte" d="M80,20 L320,20 L320,150 L240,170 L160,160 L80,130 Z" onclick="sel(this,'Norte')"/>
      <!-- Nordeste -->
      <path id="nordeste" d="M240,20 L370,20 L390,100 L360,180 L280,190 L240,170 L320,150 Z" onclick="sel(this,'Nordeste')"/>
      <!-- Centro-Oeste -->
      <path id="co" d="M100,140 L240,155 L270,175 L255,270 L140,265 L80,210 Z" onclick="sel(this,'Centro-Oeste')"/>
      <!-- Sudeste -->
      <path id="sudeste" d="M210,255 L300,235 L330,305 L285,345 L225,340 L200,300 Z" onclick="sel(this,'Sudeste')"/>
      <!-- Sul -->
      <path id="sul" d="M175,330 L245,340 L260,395 L205,410 L160,390 Z" onclick="sel(this,'Sul')"/>
      <!-- Labels -->
      <text x="190" y="90" text-anchor="middle" font-size="12" fill="#555" font-family="Montserrat,sans-serif">Norte</text>
      <text x="330" y="100" text-anchor="middle" font-size="10" fill="#555" font-family="Montserrat,sans-serif">Nordeste</text>
      <text x="170" y="210" text-anchor="middle" font-size="10" fill="#555" font-family="Montserrat,sans-serif">C. Oeste</text>
      <text x="265" y="295" text-anchor="middle" font-size="10" fill="#555" font-family="Montserrat,sans-serif">Sudeste</text>
      <text x="205" y="380" text-anchor="middle" font-size="10" fill="#555" font-family="Montserrat,sans-serif">Sul</text>
    </svg>
    <div class="city-block">
      <p>Após o Estado selecionado,<br>escolha sua cidade:</p>
      <input class="city-line" type="text" id="cidade" placeholder=""/>
    </div>
    <button class="btn btn-o" style="margin-top:16px" onclick="buscar()">BUSCAR QUADRAS</button>
  </div>
  <nav class="bnav">
    <a class="bitem" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Início</span></a>
    <a class="bitem active" href="minha-agenda.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Agenda</span></a>
    <a class="bitem" href="notificacoes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>Notificações</span></a>
    <a class="bitem" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span></a>
  </nav>
</div>
<script src="../js/api.js"></script>
<script>
exigirLogin();
let reg='';
function sel(el,nome){document.querySelectorAll('.mapa path').forEach(p=>p.classList.remove('sel'));el.classList.add('sel');reg=nome}
function buscar(){
  if(!reg){alert('Selecione uma região no mapa.');return;}
  // A cidade vai como filtro para GET /api/arenas?cidade= (sem acentos, como está no banco).
  const c=document.getElementById('cidade').value.trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  location.href='agendamentos.html'+(c?'?cidade='+encodeURIComponent(c):'');
}
</script>
</body>
</html>
