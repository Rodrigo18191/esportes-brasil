<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Realizar Agendamento</title>
<link rel="stylesheet" href="../css/global.css"/>
<style>
.content{background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;padding:30px 24px}
.ftitle{font-size:17px;font-weight:800;color:#111;font-style:italic;margin-bottom:30px}
</style>
</head>
<body>
<div class="phone">
  <div class="hdr">
    <a href="agendamentos.html" class="ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <span class="hdr-title">Agendamentos</span>
    <a href="configuracoes.html" class="ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
  </div>
  <div class="content">
    <div>
      <p class="ftitle">REALIZAR AGENDAMENTO</p>
      <p id="arena-nome" style="font-size:14px;font-weight:800;color:var(--navy);margin:-18px 0 18px"></p>
      <select class="sel" id="quadra" onchange="mostrarHorarios()"><option value="">QUADRA / ESPORTE</option></select>
      <select class="sel" id="dia" style="margin-top:14px"><option value="">DIAS DE SEMANA</option></select>
      <select class="sel" id="hr" style="margin-top:14px"><option value="">HORÁRIOS</option></select>
    </div>
    <button class="btn btn-o" onclick="agendar()">AGENDAR</button>
  </div>
  <nav class="bnav">
    <a class="bitem" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Início</span></a>
    <a class="bitem active" href="minha-agenda.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Agenda</span></a>
    <a class="bitem" href="notificacoes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>Notificações</span></a>
    <a class="bitem" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span></a>
  </nav>
</div>
<script src="../js/api.js"></script>
<script>
const arenaId=new URLSearchParams(location.search).get('arena');
let quadras=[];
document.getElementById('dia').innerHTML+=DIAS.map(d=>`<option value="${d.valor}">${d.rotulo}</option>`).join('');
if(exigirLogin()){
  if(!arenaId)location.replace('agendamentos.html');
  else carregar();
}
async function carregar(){
  try{
    const [arena,qs]=await Promise.all([API.arena(arenaId),API.quadras(arenaId)]);  // GET /api/arenas/:id e /quadras
    quadras=qs;
    document.getElementById('arena-nome').textContent=`${arena.nome} – ${arena.cidade}`;
    document.getElementById('quadra').innerHTML='<option value="">QUADRA / ESPORTE</option>'+
      quadras.map((q,i)=>`<option value="${q.id}">QUADRA ${String(i+1).padStart(2,'0')} – ${esc(rotuloEsporte(q.tipo_esporte))}</option>`).join('');
  }catch(e){mostrarErro(e)}
}
// Só os horários definidos para a quadra são oferecidos (RNE-002).
function mostrarHorarios(){
  const q=quadras.find(x=>x.id===document.getElementById('quadra').value);
  document.getElementById('hr').innerHTML='<option value="">HORÁRIOS</option>'+
    (q?q.horarios_disponiveis.map(h=>`<option>${h}</option>`).join(''):'');
}
async function agendar(){
  const quadra_id=document.getElementById('quadra').value;
  const dia_semana=document.getElementById('dia').value;
  const horario=document.getElementById('hr').value;
  if(!quadra_id||!dia_semana||!horario){alert('Selecione a quadra, o dia e o horário.');return;}
  try{
    await API.reservar({quadra_id,dia_semana,horario});   // POST /api/reservas (RF-004, RNE-001, RNE-002)
    alert(`Agendamento confirmado!\n${rotuloDia(dia_semana)} às ${horario}`);
    location.href='minha-agenda.html';
  }catch(e){mostrarErro(e)}
}
</script>
</body>
</html>
