<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Criar Turma</title>
<link rel="stylesheet" href="../css/global.css"/>
<style>
.top-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
.nome-field{flex:1}
.nome-field label{font-size:12px;font-weight:700;color:#111;display:block;margin-bottom:6px;font-style:italic}
.nome-field input{width:100%;height:36px;border:none;border-bottom:2px solid #333;outline:none;font-size:13px;font-family:'Montserrat',sans-serif;padding:0 4px;background:transparent}
.btn-minha{background:var(--orange);border:none;border-radius:30px;color:#fff;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;padding:10px 14px;cursor:pointer;white-space:nowrap;line-height:1.3;text-align:center;text-decoration:none;display:block}
.sel-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.sel-row select{font-size:10px}
.ath-lbl{font-size:13px;font-weight:700;color:#111;font-style:italic;margin-bottom:10px}
.ath-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ath-row input{flex:1;height:30px;border:none;border-bottom:1.5px solid #333;outline:none;font-size:13px;font-family:'Montserrat',sans-serif;background:transparent}
.cbtn{width:24px;height:24px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;line-height:1}
.add{background:#2ecc71}.rem{background:#e74c3c}
</style>
</head>
<body>
<div class="phone">
  <div class="hdr">
    <a href="home.html" class="ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <span class="hdr-title">Criar Turma</span>
    <a href="configuracoes.html" class="ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
  </div>
  <div class="content">
    <div class="top-row">
      <div class="nome-field"><label>Nome da turma:</label><input type="text" id="nome"/></div>
      <a href="minha-turma.html" class="btn-minha">Acessar<br>Minha Turma ›</a>
    </div>
    <div class="sel-row">
      <select class="sel"><option>QUANTIDADE DE ATLETAS</option><option>2</option><option>4</option><option>6</option><option>8</option><option>10</option></select>
      <select class="sel"><option>SELECIONAR ESPORTE</option><option>Vôlei de Praia</option><option>Futevôlei</option><option>Beach Tênis</option><option>Futsal</option><option>Vôlei de Quadra</option></select>
    </div>
    <p class="ath-lbl">Nomes dos Atletas:</p>
    <div id="lista">
      <div class="ath-row"><input type="text" placeholder="Nome do atleta"/><button class="cbtn add" onclick="add()">+</button></div>
      <div class="ath-row"><input type="text" placeholder="Nome do atleta"/><button class="cbtn rem" onclick="rem(this)">−</button></div>
    </div>
    <button class="btn btn-o" style="margin-top:20px;border-radius:16px" onclick="criar()">CRIAR!</button>
  </div>
  <nav class="bnav">
    <a class="bitem" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Início</span></a>
    <a class="bitem active" href="minha-agenda.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Agenda</span></a>
    <a class="bitem" href="notificacoes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>Notificações</span></a>
    <a class="bitem" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span></a>
  </nav>
</div>
<script>
function add(){const l=document.getElementById('lista');const d=document.createElement('div');d.className='ath-row';d.innerHTML=`<input type="text" placeholder="Nome do atleta"/><button class="cbtn rem" onclick="rem(this)">−</button>`;l.appendChild(d)}
function rem(b){const r=b.closest('.ath-row');if(document.querySelectorAll('.ath-row').length>1)r.remove()}
function criar(){const n=document.getElementById('nome').value.trim();if(!n){alert('Informe o nome da turma.');return;}alert(`Turma "${n}" criada!`);location.href='minha-turma.html'}
</script>
</body>
</html>
