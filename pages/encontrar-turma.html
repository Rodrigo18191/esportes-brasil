<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Encontrar Turma</title>
<link rel="stylesheet" href="../css/global.css"/>
<style>
.etitle{font-size:14px;font-weight:800;color:#111;text-transform:uppercase;text-align:center;letter-spacing:.04em;margin-bottom:16px;font-style:italic}
.esub{font-size:14px;font-weight:800;color:#111;text-align:center;text-transform:uppercase;letter-spacing:.04em;margin-bottom:16px}
</style>
</head>
<body>
<div class="phone">
  <div class="hdr">
    <button class="ibtn" onclick="voltar()"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <span class="hdr-title">Encontrar Turma</span>
    <a href="configuracoes.html" class="ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
  </div>

  <!-- Tela 1: selecionar esporte -->
  <div class="content" id="t1">
    <p class="etitle">SELECIONE O ESPORTE<br>QUE VOCÊ QUER JOGAR!</p>
    <div id="esportes"></div>
  </div>

  <!-- Tela 2: lista de turmas -->
  <div class="content" id="t2" style="display:none">
    <p class="esub" id="esub"></p>
    <div id="turmas"></div>
  </div>

  <nav class="bnav">
    <a class="bitem" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Início</span></a>
    <a class="bitem active" href="minha-agenda.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Agenda</span></a>
    <a class="bitem" href="notificacoes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>Notificações</span></a>
    <a class="bitem" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span></a>
  </nav>
</div>
<script src="../js/api.js"></script>
<script>
let emTela2=false, esporteAtual=null;
if(exigirLogin()){
  document.getElementById('esportes').innerHTML=ESPORTES.map(e=>`<button class="btn btn-n" onclick="verTurmas('${e.valor}')">${e.rotulo}</button>`).join('');
}
async function verTurmas(esp){
  emTela2=true;esporteAtual=esp;
  document.getElementById('t1').style.display='none';
  document.getElementById('t2').style.display='block';
  document.getElementById('esub').textContent=rotuloEsporte(esp);
  const el=document.getElementById('turmas');
  el.innerHTML='<p class="carregando">Carregando turmas...</p>';
  try{
    const turmas=await API.turmas(esp);   // GET /api/turmas?esporte= (RF-006, RNE-006)
    if(!turmas.length){el.innerHTML='<p class="carregando">Nenhuma turma aberta para este esporte.</p>';return;}
    el.innerHTML=turmas.map(t=>`
    <div class="turma-item" onclick="participar('${t.id}','${esc(t.nome)}')">
      <span class="turma-lider">${esc(t.nome)}<br><small style="font-weight:600;opacity:.8">${esc(t.criador_nome)} · ${esc(t.horario)}</small></span>
      <div class="turma-meta">
        <span class="turma-vagas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>${t.vagas_preenchidas}/${t.vagas_total}</span>
      </div>
    </div>`).join('');
  }catch(e){el.innerHTML=`<p class="carregando">${esc(e.message)}</p>`}
}
async function participar(id,nome){
  if(!confirm(`Entrar na turma "${nome}"?`))return;
  try{
    await API.participar(id);   // POST /api/turmas/:id/participar (RNE-004)
    alert('Você entrou na turma!');
    verTurmas(esporteAtual);
  }catch(e){mostrarErro(e)}
}
function voltar(){
  if(emTela2){emTela2=false;document.getElementById('t2').style.display='none';document.getElementById('t1').style.display='block'}
  else{location.href='home.html'}
}
</script>
</body>
</html>
