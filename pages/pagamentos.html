<style>
.add-btn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);border:none;border-radius:30px;padding:10px 18px;color:#fff;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;letter-spacing:.04em;cursor:pointer;margin-bottom:20px}
.credit-card{background:#7b2ff7;border-radius:16px;padding:22px 20px 18px;margin-bottom:16px;position:relative;overflow:hidden}
.credit-card::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,.07);border-radius:50%}
.nu{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.nu-text{color:#fff;font-size:16px;font-weight:900;letter-spacing:-.5px}
.nu-sub{color:#fff;font-size:12px;font-weight:400}
.card-num{color:#fff;font-size:13px;font-weight:600;letter-spacing:.12em;margin-bottom:10px}
.card-bot{display:flex;justify-content:space-between;align-items:flex-end}
.card-dates{display:flex;gap:20px}
.card-dates span{color:rgba(255,255,255,.7);font-size:10px}
.card-name{color:#fff;font-size:12px;font-weight:700;letter-spacing:.06em}
.mc{display:flex}
.mc span:first-child{width:22px;height:22px;background:#eb001b;border-radius:50%;display:block}
.mc span:last-child{width:22px;height:22px;background:#f79e1b;border-radius:50%;display:block;margin-left:-8px}
</style>
