<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Realizar Avaliação</title>
<link rel="stylesheet" href="../css/global.css"/>
<style>
.content{background:var(--bg);display:flex;flex-direction:column;padding:30px 24px}
.ftitle{font-size:17px;font-weight:800;color:#111;font-style:italic;margin-bottom:30px}
.drop-wrap{position:relative;margin-bottom:16px}
.drop-trigger{width:100%;height:50px;border:1.5px solid #bbb;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-family:'Montserrat',sans-serif}
.drop-trigger svg{width:16px;height:16px;stroke:#333;fill:none;stroke-width:2;stroke-linecap:round}
.drop-list{position:absolute;top:52px;left:0;right:0;background:#fff;border:1.5px solid #bbb;border-radius:8px;overflow:hidden;z-index:10;display:none}
.drop-list.open{display:block}
.drop-opt{padding:14px 16px;font-size:13px;font-weight:600;font-family:'Montserrat',sans-serif;text-transform:uppercase;cursor:pointer;border-bottom:1px solid #f0f0f0;transition:background .15s}
.drop-opt:hover{background:#f5f5f5}
.drop-opt.sel{color:#1a6bd6;font-weight:700}
.drop-opt:last-child{border-bottom:none}
/* sucesso */
#sucesso{display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 24px;flex:1;background:var(--bg)}
#sucesso p{font-size:13px;font-weight:700;color:#111;text-transform:uppercase;text-align:center;letter-spacing:.04em}
</style>
</head>
<body>
<div class="phone">
  <div class="hdr">
    <a href="avaliacao-quadras.html" class="ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <span class="hdr-title">Avaliação de Quadras</span>
    <a href="configuracoes.html" class="ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
  </div>
  <!-- Formulário -->
  <div class="content" id="form">
    <p class="ftitle">REALIZAR AVALIAÇÃO</p>
    <p id="arena-nome" style="font-size:14px;font-weight:800;color:var(--navy);margin-bottom:14px"></p>
    <div class="drop-wrap">
      <div class="drop-trigger" id="trig" onclick="toggle()">
        <span id="lbl">BOM</span>
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="drop-list" id="dl">
        <div class="drop-opt" onclick="pick('MUITO BOM')">MUITO BOM</div>
        <div class="drop-opt sel" onclick="pick('BOM')">BOM</div>
        <div class="drop-opt" onclick="pick('MÉDIO')">MÉDIO</div>
        <div class="drop-opt" onclick="pick('RUIM')">RUIM</div>
      </div>
    </div>
    <button class="btn btn-o" style="margin-top:20px" onclick="avaliar()">AVALIAR</button>
  </div>
  <!-- Sucesso -->
  <div id="sucesso">
    <p>AVALIAÇÃO REALIZADA<br>COM SUCESSO!</p>
    <p id="media" style="font-size:13px;font-weight:600"></p>
    <button class="btn btn-o" onclick="location.href='home.html'">VOLTAR PARA A TELA PRINCIPAL</button>
    <button class="btn btn-o" onclick="nova()">REALIZAR NOVA AVALIAÇÃO</button>
  </div>
  <nav class="bnav">
    <a class="bitem" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Início</span></a>
    <a class="bitem active" href="minha-agenda.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Agenda</span></a>
    <a class="bitem" href="notificacoes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>Notificações</span></a>
    <a class="bitem" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span></a>
  </nav>
</div>
<script src="../js/api.js"></script>
<script>
const arenaId=new URLSearchParams(location.search).get('arena');
const NOTAS={'MUITO BOM':'MUITO_BOM','BOM':'BOM','MÉDIO':'MEDIO','RUIM':'RUIM'};
if(exigirLogin()){
  if(!arenaId)location.replace('avaliacao-quadras.html');
  else API.arena(arenaId).then(a=>{document.getElementById('arena-nome').textContent=a.nome}).catch(mostrarErro);
}
let cur='BOM';
function toggle(){document.getElementById('dl').classList.toggle('open')}
function pick(v){cur=v;document.getElementById('lbl').textContent=v;document.querySelectorAll('.drop-opt').forEach(o=>o.classList.toggle('sel',o.textContent===v));document.getElementById('dl').classList.remove('open')}
async function avaliar(){
  try{
    const r=await API.avaliar(arenaId,NOTAS[cur]);   // POST /api/avaliacoes (RNE-005)
    document.getElementById('media').textContent=`Nova média da arena ${r.arena.nome}: ${Number(r.arena.avaliacao_media).toFixed(1)}`;
    document.getElementById('form').style.display='none';document.getElementById('sucesso').style.display='flex';
  }catch(e){mostrarErro(e)}
}
function nova(){document.getElementById('form').style.display='flex';document.getElementById('sucesso').style.display='none';pick('BOM')}
document.addEventListener('click',e=>{if(!e.target.closest('.drop-wrap'))document.getElementById('dl').classList.remove('open')})
</script>
</body>
</html>
