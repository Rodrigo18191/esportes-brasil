<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Verificação de Código</title>
<link rel="stylesheet" href="../css/global.css"/>
<style>
.phone{justify-content:flex-start;padding:50px 32px 40px;background:#fff}
.logo{background:var(--navy);border-radius:22px;width:100px;height:100px;display:flex;align-items:center;justify-content:center;margin:0 auto 32px;box-shadow:0 8px 24px rgba(15,27,61,.25)}
.logo svg{width:62px;height:62px}
h2{font-size:22px;font-weight:700;color:#111;margin-bottom:16px;line-height:1.3;text-align:center}
p{font-size:12px;color:#555;margin-bottom:24px;line-height:1.6;text-align:center}
.otp-wrap{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
.otp-box{width:46px;height:54px;border:2px solid #ccc;border-radius:8px;font-size:20px;font-weight:700;text-align:center;font-family:'Montserrat',sans-serif;outline:none;transition:border-color .2s}
.otp-box:focus{border-color:var(--navy)}
.reenviar{font-size:12px;color:var(--navy);font-weight:600;cursor:pointer;text-align:center;display:block;margin-bottom:24px;text-decoration:none}
</style>
</head>
<body>
<div class="phone">
  <div class="logo">
    <svg viewBox="0 0 64 64" fill="none">
      <rect x="6" y="12" width="52" height="44" rx="6" fill="white" fill-opacity=".15" stroke="white" stroke-width="2.5"/>
      <rect x="6" y="12" width="52" height="14" rx="6" fill="white" fill-opacity=".3"/>
      <rect x="19" y="6" width="4" height="12" rx="2" fill="white"/>
      <rect x="41" y="6" width="4" height="12" rx="2" fill="white"/>
      <circle cx="32" cy="38" r="10" fill="white" fill-opacity=".9"/>
      <polygon points="32,30 36,33 34.5,38 29.5,38 28,33" fill="#0f1b3d"/>
    </svg>
  </div>
  <h2>Acabamos de enviar um código para seu e-mail</h2>
  <p>Insira no campo abaixo o código de verificação de 5 dígitos enviado para o seu e-mail.</p>
  <div class="otp-wrap">
    <input class="otp-box" type="text" maxlength="1" id="o1" oninput="next(this,'o2')"/>
    <input class="otp-box" type="text" maxlength="1" id="o2" oninput="next(this,'o3')"/>
    <input class="otp-box" type="text" maxlength="1" id="o3" oninput="next(this,'o4')"/>
    <input class="otp-box" type="text" maxlength="1" id="o4" oninput="next(this,'o5')"/>
    <input class="otp-box" type="text" maxlength="1" id="o5" oninput="next(this,null)"/>
  </div>
  <a class="reenviar" href="#">Reenviar código</a>
  <button class="btn btn-o" onclick="enviar()">Enviar</button>
</div>
<script>
function next(el, nxtId){
  if(el.value.length===1 && nxtId) document.getElementById(nxtId).focus();
}
function enviar(){
  const cod=['o1','o2','o3','o4','o5'].map(id=>document.getElementById(id).value).join('');
  if(cod.length<5){alert('Preencha o código completo.');return;}
  alert('Código verificado! Redefinindo senha...');
  location.href='login.html';
}
</script>
</body>
</html>
