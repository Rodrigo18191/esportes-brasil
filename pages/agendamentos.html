<body>
<div class="phone">
  <div class="hdr">

  <div class="content bg">
    <p class="slbl">ARENAS:</p>
    <div class="arena-grid" id="grid"></div>
  </div>
  <nav class="bnav">
    <a class="bitem" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Início</span></a>

    <a class="bitem" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span></a>

</div>
<script src="../js/app.js"></script>
<script>
const cores=['#e63946','#2b9348','#023e8a','#e76f51'];
const g=document.getElementById('grid');
DB.arenas.forEach((a,i)=>{
  g.innerHTML+=`<div class="arena-card" onclick="location.href='realizar-agendamento.html'">
    <div class="arena-badge" style="background:${cores[i]}">${a.sigla}</div>
    <div class="arena-name">${a.nome}</div>
    <div class="arena-rating"><span class="star">★</span> ${a.rating.toFixed(1)} (${a.avals} avaliações)</div>
  </div>`;
});
</script>
</body>
</html>
