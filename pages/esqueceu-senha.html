<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Esqueceu a senha</title>
<link rel="stylesheet" href="../css/global.css"/>
<style>
.phone{justify-content:flex-start;padding:50px 32px 40px;background:#fff}
.logo{background:var(--navy);border-radius:22px;width:100px;height:100px;display:flex;align-items:center;justify-content:center;margin:0 auto 32px;box-shadow:0 8px 24px rgba(15,27,61,.25)}
.logo svg{width:62px;height:62px}
h2{font-size:28px;font-weight:700;color:#111;margin-bottom:20px;line-height:1.2}
p{font-size:13px;color:#555;margin-bottom:16px;line-height:1.6}
.inp{width:100%;height:46px;border:1.5px solid #ccc;border-radius:8px;padding:0 14px;font-family:'Montserrat',sans-serif;font-size:13px;outline:none;margin-bottom:20px;transition:border-color .2s}
.inp:focus{border-color:var(--navy)}
</style>
</head>
<body>
<div class="phone">
  <div class="logo">
    <svg viewBox="0 0 64 64" fill="none">
      <rect x="6" y="12" width="52" height="44" rx="6" fill="white" fill-opacity=".15" stroke="white" stroke-width="2.5"/>
      <rect x="6" y="12" width="52" height="14" rx="6" fill="white" fill-opacity=".3"/>
      <rect x="19" y="6" width="4" height="12" rx="2" fill="white"/>
      <rect x="41" y="6" width="4" height="12" rx="2" fill="white"/>
      <circle cx="32" cy="38" r="10" fill="white" fill-opacity=".9"/>
      <polygon points="32,30 36,33 34.5,38 29.5,38 28,33" fill="#0f1b3d"/>
    </svg>
  </div>
  <h2>Esqueceu<br>sua senha?</h2>
  <p>Informe o e-mail, número de celular ou nome de usuário associado à sua conta para alterar sua senha.</p>
  <input class="inp" type="text" id="campo" placeholder=""/>
  <button class="btn btn-o" onclick="avancar()">Avançar</button>
</div>
<script>
function avancar(){
  const v=document.getElementById('campo').value.trim();
  if(!v){alert('Preencha o campo.');return;}
  location.href='codigo-verificacao.html';
}
</script>
</body>
</html>
